[package]
name = "hivebear-egui"
description = "HiveBear desktop app with a native egui interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hivebear-core = { path = "../hivebear-core" }
hivebear-inference = { path = "../hivebear-inference", default-features = false }
hivebear-mesh = { path = "../hivebear-mesh" }
hivebear-persistence = { path = "../hivebear-persistence" }
hivebear-registry = { path = "../hivebear-registry" }

eframe = { version = "0.36", features = ["persistence"] }
egui-phosphor = "0.14"
egui_commonmark = { version = "0.25", default-features = false, features = [
    "pulldown_cmark",
    "better_syntax_highlighting",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Crash reporting. default-features is off because the default `transport`
# feature pulls in native-tls, and HiveBear is rustls-only at runtime.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "logs",
    "release-health",
    "reqwest",
    "rustls",
    "tracing",
] }

[features]
default = ["llamacpp", "candle"]
llamacpp = ["hivebear-inference/llamacpp"]
llamacpp-metal = ["llamacpp", "hivebear-inference/llamacpp-metal"]
llamacpp-cuda = ["llamacpp", "hivebear-inference/llamacpp-cuda"]
llamacpp-vulkan = ["llamacpp", "hivebear-inference/llamacpp-vulkan"]
candle = ["hivebear-inference/candle"]
